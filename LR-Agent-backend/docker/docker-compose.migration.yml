name: lr-agent-migration

# Standalone stack for D:\Study\LR-Agent-LangChain-Migration only.
# Use with: docker compose --env-file .env.migration -f docker-compose.migration.yml up -d --build
# Never combine this file with docker-compose.yml or docker-compose.override.yml.
services:
  postgres:
    container_name: lr-agent-migration-postgres
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.migration}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.migration}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env.migration}
    ports:
      - "127.0.0.1:15432:5432"
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      - migration-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    container_name: lr-agent-migration-redis
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env.migration}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --maxmemory 256mb --maxmemory-policy allkeys-lru"]
    ports:
      - "127.0.0.1:16379:6379"
    volumes:
      - redis-data:/data
    networks:
      - migration-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    container_name: lr-agent-migration-minio
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env.migration}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env.migration}
    ports:
      - "127.0.0.1:19000:9000"
      - "127.0.0.1:19001:9001"
    volumes:
      - minio-data:/data
    networks:
      - migration-net

  api:
    container_name: lr-agent-migration-api
    image: lr-agent-migration-api:local
    build:
      context: ..
      dockerfile: docker/Dockerfile.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      APP_ENV: production
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env.migration}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: lr-agent-migration-avatars
      MINIO_SECURE: "false"
      MINIO_PUBLIC_BASE_URL: http://127.0.0.1:19000/lr-agent-migration-avatars
      CORS_ORIGINS: '["http://localhost:1213","http://127.0.0.1:1213"]'
      SMTP_HOST: ""
      SMTP_PORT: "587"
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      SMTP_FROM: noreply@example.com
    ports:
      - "127.0.0.1:18000:8000"
    networks:
      - migration-net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

networks:
  migration-net:
    name: lr-agent-migration-net

volumes:
  pg-data:
    name: lr-agent-migration-pg-data
  redis-data:
    name: lr-agent-migration-redis-data
  minio-data:
    name: lr-agent-migration-minio-data
